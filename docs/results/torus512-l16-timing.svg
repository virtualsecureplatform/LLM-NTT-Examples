<svg xmlns="http://www.w3.org/2000/svg" width="940" height="355" viewBox="0 0 940 355" role="img" aria-labelledby="title desc">
<title id="title">L16/PE8 routed setup slack at 250 MHz</title>
<desc id="desc">Native NGen controls improve setup slack from minus 2.258 nanoseconds to plus 0.038 nanoseconds. The final variant passes setup, hold, endpoint and clock-route checks.</desc>
<rect width="940" height="355" fill="white"/>
<g font-family="sans-serif" fill="#253348">
<text x="24" y="30" font-size="20" font-weight="bold">N512 · L16/PE8 · 250 MHz routed timing</text>
<text x="24" y="54" font-size="12">Exact full32 × ternary product · U280 registered kernel harness · higher slack is better</text>
<line x1="330.0" y1="78" x2="330.0" y2="282" stroke="#e3e8ed"/>
<text x="330.0" y="302" text-anchor="middle" font-size="12">-2.5</text>
<line x1="421.07142857142856" y1="78" x2="421.07142857142856" y2="282" stroke="#e3e8ed"/>
<text x="421.07142857142856" y="302" text-anchor="middle" font-size="12">-2</text>
<line x1="512.1428571428571" y1="78" x2="512.1428571428571" y2="282" stroke="#e3e8ed"/>
<text x="512.1428571428571" y="302" text-anchor="middle" font-size="12">-1.5</text>
<line x1="603.2142857142858" y1="78" x2="603.2142857142858" y2="282" stroke="#e3e8ed"/>
<text x="603.2142857142858" y="302" text-anchor="middle" font-size="12">-1</text>
<line x1="694.2857142857142" y1="78" x2="694.2857142857142" y2="282" stroke="#e3e8ed"/>
<text x="694.2857142857142" y="302" text-anchor="middle" font-size="12">-0.5</text>
<line x1="785.3571428571429" y1="78" x2="785.3571428571429" y2="282" stroke="#5c6675"/>
<text x="785.3571428571429" y="302" text-anchor="middle" font-size="12">0</text>
<text x="24" y="110" font-size="13">Original · Default</text>
<rect x="374.08" y="92" width="411.28" height="26" fill="#b44a48"/>
<text x="793.36" y="110" font-size="13">-2.258 ns</text>
<text x="24" y="158" font-size="13">INREG1 + ONEHOT · Default</text>
<rect x="711.41" y="140" width="73.95" height="26" fill="#b44a48"/>
<text x="793.36" y="158" font-size="13">-0.406 ns</text>
<text x="24" y="206" font-size="13">INREG1 + ONEHOT · Explore</text>
<rect x="745.83" y="188" width="39.53" height="26" fill="#b44a48"/>
<text x="793.36" y="206" font-size="13">-0.217 ns</text>
<text x="24" y="254" font-size="13">+ ISSUEREG1 · Default</text>
<rect x="785.36" y="236" width="6.92" height="26" fill="#218457"/>
<text x="800.28" y="254" font-size="13">+0.038 ns</text>
<text x="585" y="326" text-anchor="middle" font-size="13">Routed setup slack (ns)</text>
<text x="24" y="348" font-size="11">Final hold slack +0.010 ns; interval 519 cycles/product. Resources and latency are in the accompanying CSV.</text>
</g></svg>
